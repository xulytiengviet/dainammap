name: Deploy DainamMap to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure historic tiles exist
        run: |
          test -s assets/dai-nam-image-space.pmtiles || { echo "::error::Missing assets/dai-nam-image-space.pmtiles"; exit 1; }
          test -s assets/dai-nam-1838-source.png || { echo "::error::Missing assets/dai-nam-1838-source.png"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
